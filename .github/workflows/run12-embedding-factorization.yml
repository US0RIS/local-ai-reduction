name: Run 12 embedding-factorization test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/run12_embedding_factorization.py'
      - 'tools/run12_embedding_gate.py'
      - '.github/workflows/run12-embedding-factorization.yml'

permissions:
  contents: read

jobs:
  smollm2-embedding-factorization:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers safetensors huggingface_hub
      - name: Run tied embedding/head factorization
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_XET_HIGH_PERFORMANCE: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python tools/run12_embedding_factorization.py \
            --model HuggingFaceTB/SmolLM2-135M \
            --eval-tokens 512 \
            --ranks 32,48,64,96,128,192,256,384 \
            --out benchmarks/run12_embedding_factorization.json
      - name: Apply precommitted gate
        run: python tools/run12_embedding_gate.py --result benchmarks/run12_embedding_factorization.json --out benchmarks/RUN12_GATE.json
      - name: Show result
        run: cat benchmarks/RUN12_GATE.json
      - uses: actions/upload-artifact@v4
        with:
          name: run12-embedding-factorization
          path: |
            benchmarks/run12_embedding_factorization.json
            benchmarks/RUN12_GATE.json
          if-no-files-found: error
