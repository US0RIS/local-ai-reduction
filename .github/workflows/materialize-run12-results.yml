name: Materialize Run 12 results

on:
  push:
    branches:
      - larc-run12-embedding-factorization
    paths:
      - '.github/workflows/materialize-run12-results.yml'

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: larc-run12-embedding-factorization
      - name: Download exact Run 12 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/run12
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9027352844/zip > /tmp/run12.zip
          unzip -o -j /tmp/run12.zip -d /tmp/run12
          cp /tmp/run12/run12_embedding_factorization.json benchmarks/
          cp /tmp/run12/RUN12_GATE.json benchmarks/
      - name: Commit exact outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/run12_embedding_factorization.json benchmarks/RUN12_GATE.json benchmarks/RUN12_FINAL_STATUS.json
          git commit -m 'Record Run 12 embedding-floor evidence'
          git push origin HEAD:larc-run12-embedding-factorization
