name: LARC real-model validation

# Manual-only until this repository has a functioning hosted runner allocation.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: LARC profile to validate
        required: true
        default: 10x
        type: choice
        options: [10x, 15x, 20x, 30x]

permissions:
  contents: read

jobs:
  smollm2:
    name: SmolLM2 ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Clone repository without reusable actions
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf ./* ./.??* 2>/dev/null || true
          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          python --version
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.48.3 accelerate==1.3.0 safetensors==0.5.2 psutil==6.1.1 sentencepiece==0.2.0 hf_xet
      - name: Validate packed INT4 primitive
        run: |
          PYTHONPATH=. python - <<'PY'
          import torch
          from larc.q4_runtime import q4_rows, q4_mm
          torch.manual_seed(0)
          w=torch.randn(97,64); x=torch.randn(11,64)
          p,s,c=q4_rows(w); y=q4_mm(x,p,s,c)
          assert y.shape==(11,97) and torch.isfinite(y).all()
          print('packed q4 primitive OK', p.numel()+s.numel()*s.element_size(), 'resident bytes')
          PY
      - name: Run real-model benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          PYTHONPATH=. python tools/real_model_benchmark.py --profile '${{ inputs.profile }}' --out 'benchmarks/run2_smollm2_${{ inputs.profile }}.json'
          cat 'benchmarks/run2_smollm2_${{ inputs.profile }}.json'
