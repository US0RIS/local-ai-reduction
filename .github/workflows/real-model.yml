name: LARC real-model validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smollm2:
    name: SmolLM2 ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        profile: [10x, 15x, 20x, 30x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install transformers==4.48.3 accelerate==1.3.0 safetensors==0.5.2 psutil==6.1.1 sentencepiece==0.2.0 hf_xet
      - name: Validate packed INT4 primitive
        run: |
          PYTHONPATH=. python - <<'PY'
          import torch
          from larc.q4_runtime import q4_rows, q4_mm
          torch.manual_seed(0)
          w=torch.randn(97,64); x=torch.randn(11,64)
          p,s,c=q4_rows(w); y=q4_mm(x,p,s,c)
          assert y.shape==(11,97) and torch.isfinite(y).all()
          print('packed q4 primitive OK', p.numel()+s.numel()*s.element_size(), 'resident bytes')
          PY
      - name: Run real-model benchmark
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          PYTHONPATH=. python tools/real_model_benchmark.py --profile '${{ matrix.profile }}' --out 'benchmarks/run2_smollm2_${{ matrix.profile }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: larc-run2-${{ matrix.profile }}
          path: benchmarks/run2_smollm2_${{ matrix.profile }}.json
          if-no-files-found: warn
          retention-days: 30
