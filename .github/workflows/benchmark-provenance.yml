name: benchmark-provenance
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research test dependencies
        run: python -m pip install -e . pytest torch
      - run: python tools/check_benchmark_provenance.py
      - run: python tools/run4_context_sweep.py
      - run: git diff --exit-code -- benchmarks/run4_context_sweep.json
      - run: python tools/run4_packed_context_sweep.py
      - run: git diff --exit-code -- benchmarks/run4_packed_attention_context_sweep.json
      - run: python tools/run5_budget_planner.py --check
      - name: Run streaming source/converter tests
        run: pytest -q tests/test_stream_softshare_convert.py tests/test_gguf_range.py
      - name: Native packed-Q2 attention correctness
        run: |
          g++ -O3 -std=c++17 runtime/larc_q4.cpp runtime/larc_q2_attention.cpp tests/native_q2_attention.cpp -o /tmp/larc-q2-attn
          /tmp/larc-q2-attn
      - name: Native SoftShare correctness
        run: |
          g++ -O3 -std=c++17 runtime/larc_q4.cpp tests/native_q4_softshare.cpp -o /tmp/larc-softshare
          /tmp/larc-softshare
