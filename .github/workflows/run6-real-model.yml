name: Run 6 real-model geometry

on:
  workflow_dispatch:
  push:
    branches: [larc-run6-real-model]
    paths:
      - 'tools/run6_real_activation_geometry.py'
      - '.github/workflows/run6-real-model.yml'

jobs:
  smollm2-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DOWNLOAD_TIMEOUT: '180'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.4,<3'
          python -m pip install 'transformers>=4.46,<5' 'datasets>=2.20,<5' safetensors accelerate
      - name: Syntax check
        run: python -m py_compile tools/run6_real_activation_geometry.py
      - name: Probe SmolLM2-135M real activation geometry
        run: |
          python tools/run6_real_activation_geometry.py \
            --model HuggingFaceTB/SmolLM2-135M \
            --revision d6a5589c239236d22370e2126bbe23d4843c47d9 \
            --output benchmarks/run6_smollm2_135m_geometry.json \
            --context 256 \
            --calibration-tokens 4096 \
            --evaluation-tokens 4096 \
            --sample-rows 1024 \
            --sharing-eval-tokens 2048
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run6-smollm2-135m-geometry
          path: benchmarks/run6_smollm2_135m_geometry.json
          if-no-files-found: warn
