name: Public SmolLM2 F16 teacher evaluation
on:
  push:
    branches: [model-eval-sandbox]
    paths:
      - '.github/workflows/model-eval-smollm2-f16.yml'
      - 'tools/model_eval/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: model-eval-smollm2-f16
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-eval-sandbox
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evaluation dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy requests pyarrow transformers tokenizers
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run hash-pinned teacher NLL
        id: eval
        shell: bash
        run: |
          mkdir -p results
          set +e
          python tools/model_eval/smollm2_f16_wikitext.py 2>&1 | tee results/smollm2_f16_teacher_wikitext.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist result or failure log
        if: always()
        shell: bash
        run: |
          git config user.name 'model-eval-bot'
          git config user.email 'model-eval-bot@users.noreply.github.com'
          files=(results/smollm2_f16_teacher_wikitext.log)
          test -f results/smollm2_f16_teacher_wikitext.json && files+=(results/smollm2_f16_teacher_wikitext.json)
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'Record SmolLM2 F16 teacher WikiText NLL'
            git pull --rebase origin model-eval-sandbox
            git push origin HEAD:model-eval-sandbox
          fi
      - name: Enforce evaluation success
        if: always()
        run: exit '${{ steps.eval.outputs.rc || 99 }}'
