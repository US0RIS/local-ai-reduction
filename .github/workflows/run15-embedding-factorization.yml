name: Run 15 tied embedding factorization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/run15_embedding_factorization.py'
      - '.github/workflows/run15-embedding-factorization.yml'
      - 'docs/RUN15_EMBEDDING_FACTORIZATION.md'
      - 'benchmarks/RUN15_STATUS.json'
  pull_request:
    paths:
      - 'tools/run15_embedding_factorization.py'
      - '.github/workflows/run15-embedding-factorization.yml'
      - 'docs/RUN15_EMBEDDING_FACTORIZATION.md'

permissions:
  contents: read

jobs:
  tied-embedding-factorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: external/llama.cpp
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.57.6' accelerate 'huggingface-hub>=0.34,<1'

      - name: Fetch canonical WikiText-2 test corpus
        run: |
          (cd external/llama.cpp && bash scripts/get-wikitext-2.sh)
          test -f external/llama.cpp/wikitext-2-raw/wiki.test.raw
          sha256sum external/llama.cpp/wikitext-2-raw/wiki.test.raw

      - name: Run tied embedding/head factorization diagnostic
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_XET_HIGH_PERFORMANCE: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          mkdir -p benchmarks
          python tools/run15_embedding_factorization.py \
            --model HuggingFaceTB/SmolLM2-135M \
            --evaluation external/llama.cpp/wikitext-2-raw/wiki.test.raw \
            --ranks 64,128,192,256 \
            --eval-tokens 8192 --context 512 \
            --out benchmarks/run15_embedding_factorization.json

      - uses: actions/upload-artifact@v4
        with:
          name: run15-embedding-factorization
          path: benchmarks/run15_embedding_factorization.json
          if-no-files-found: error
          retention-days: 90
