name: Run 8 additive-VQ real-model test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/run8_additive_vq_real_model.py'
      - 'tools/run8_decision_gate.py'
      - '.github/workflows/run8-additive-vq.yml'

permissions:
  contents: read

jobs:
  smollm2-additive-vq:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers safetensors huggingface_hub

      - name: Run activation-aware additive VQ
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_XET_HIGH_PERFORMANCE: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python tools/run8_additive_vq_real_model.py \
            --model HuggingFaceTB/SmolLM2-135M \
            --cal-tokens 128 \
            --eval-tokens 512 \
            --vector-dim 32 \
            --codebook-size 16 \
            --max-stages 8 \
            --checkpoints 2,4,6,8 \
            --layer-group-size 10 \
            --sample-vectors 8192 \
            --kmeans-iters 7 \
            --out benchmarks/run8_additive_vq_real_model.json

      - name: Apply precommitted Run 8 gate
        run: |
          python tools/run8_decision_gate.py \
            --result benchmarks/run8_additive_vq_real_model.json \
            --out benchmarks/RUN8_GATE.json

      - name: Show compact result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('benchmarks/run8_additive_vq_real_model.json'))
          g=json.load(open('benchmarks/RUN8_GATE.json'))
          print(json.dumps({'baselines':r['baselines'],'stages':r['stage_results'],'gate':g},indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: run8-additive-vq-results
          path: |
            benchmarks/run8_additive_vq_real_model.json
            benchmarks/RUN8_GATE.json
          if-no-files-found: error
